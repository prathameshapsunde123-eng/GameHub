<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Paper Scissors</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>✊ Stone Paper Scissors ✋</h1>

<div class="scoreboard">

Player :
<span id="playerScore">0</span>

|

Computer :
<span id="computerScore">0</span>

</div>

<div class="choices">

<button onclick="play('rock')">✊<br>Stone</button>

<button onclick="play('paper')">✋<br>Paper</button>

<button onclick="play('scissors')">✌️<br>Scissors</button>

</div>

<div class="result">

<h2 id="playerChoice">Player :</h2>

<h2 id="computerChoice">Computer :</h2>

<h1 id="winner">Choose your move!</h1>

</div>

<button class="reset" onclick="resetGame()">

Restart

</button>

</div>

<script src="script.js"></script>

</body>
</html>
