<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1> Tic Tac Toe</h1>

<div class="mode" >
    <button id="friendBtn" onclick="setMode('friend')">Friend</button>
    <button id="computerBtn" onclick="setMode('computer')">Computer</button>
</div>

<h2 id="status">Player X Turn</h2>

<div class="board" id="board">
    <div class="cell" onclick="play(this,0)"></div>
    <div class="cell" onclick="play(this,1)"></div>
    <div class="cell" onclick="play(this,2)"></div>

    <div class="cell" onclick="play(this,3)"></div>
    <div class="cell" onclick="play(this,4)"></div>
    <div class="cell" onclick="play(this,5)"></div>

    <div class="cell" onclick="play(this,6)"></div>
    <div class="cell" onclick="play(this,7)"></div>
    <div class="cell" onclick="play(this,8)"></div>
</div>

<div class="score">

Player X :
<span id="xScore">0</span>

Player O :
<span id="oScore">0</span>

</div>

<button class="restart" onclick="restart()">
Restart
</button>

</body>

<script src="script.js"></script>
</html>
